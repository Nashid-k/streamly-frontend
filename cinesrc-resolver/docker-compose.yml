# cinesrc-resolver — any VPS with Docker. One-command deploy:
#   cd cinesrc-resolver
#   docker compose up -d --build          # builds locally, daemonizes
#   docker compose logs -f                # watch it come up
# Then expose :3100 (or put a reverse proxy in front) and set the public URL in
# src/api/cinesrcResolver.js -> CINESRC_RESOLVER_ORIGIN, or as a Vercel env.
# Keep the port firewalled from the public internet if the operator only hits
# it from Vercel — the /resolve endpoint has no auth (the URL is the secret).
services:
  cinesrc-resolver:
    build: .
    image: cinesrc-resolver:latest
    container_name: cinesrc-resolver
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
      - MAX_PAGES=1
      - CHROME_PATH=/usr/bin/google-chrome
    # Chrome: give /dev/shm real memory (default is 64MB and headless crashes).
    shm_size: "512mb"
    mem_limit: 1024m
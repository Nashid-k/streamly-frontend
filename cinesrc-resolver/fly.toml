# cinesrc-resolver — Fly.io. One-command deploy:
#   cd cinesrc-resolver
#   fly launch --auto-confirm --no-deploy     # reads this file, creates the app
#   fly deploy                                # builds the Dockerfile
# Then wire the app: set CINESRC_RESOLVER_ORIGIN in src/api/cinesrcResolver.js
# to https://<this-app>.fly.dev (and push), or add CINESRC_RESOLVER_URL on
# Vercel. The /resolve endpoint has NO auth — the URL IS the secret; use the
# long random app name fly generates, not a guessable one.

app = "cinesrc-resolver"   # rename to something unique before first deploy

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3100"
  # One Chrome per mint (2 Chromes on a 512MB box risks OOM). Forks are cheap.
  MAX_PAGES = "1"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[services]]
  internal_port = 3100
  protocol = "tcp"

  [services.concurrency]
    type = "connections"
    hard_limit = 16
    soft_limit = 8

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/healthz"
    protocol = "http"
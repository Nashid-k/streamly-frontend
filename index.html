<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Streamly - Your favorite movies and TV shows in one place." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect: CDN image proxy first, then fallback origins -->
    <link rel="preconnect" href="https://wsrv.nl" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-blocking font load: media="print" swap trick eliminates render-blocking -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
    </noscript>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Streamly</title>

    <script>
      // Selective SW revalidation on new deploy: clear only caches bound to a
      // PREVIOUS app version (keeps SW registered + image/trailer caches warm so
      // the next request revalidates via SWR instead of re-downloading everything).
      (function() {
        var V = 'v19.0';
        var prev = null;
        try { prev = localStorage.getItem('_sv'); } catch(e) {}
        if (prev !== V) {
          try {
            localStorage.setItem('_sv', V);
            var tasks = [];
            if ('caches' in window) tasks.push(caches.keys().then(function(names) {
              var stale = names.filter(function(k) { return k.indexOf('streamly') !== -1 && k !== V; });
              return Promise.all(stale.map(function(k) { return caches.delete(k); }));
            }));
            if ('serviceWorker' in navigator) tasks.push(navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.update(); }));
            }));
            Promise.all(tasks).then(function() { window.location.reload(); });
          } catch(e) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Block native context menu everywhere except when React has already handled it
      document.addEventListener('contextmenu', function(event) {
        if (!event.defaultPrevented) {
          event.preventDefault();
        }
      });
    </script>
  </body>
</html>

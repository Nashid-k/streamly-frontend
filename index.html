<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Streamly - Your favorite movies and TV shows in one place." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect: CDN image proxy first, then fallback origins.
         No preconnect to api.themoviedb.org: that host is ISP-blocked on some
         networks (see api/tmdb.js) and the app reads TMDB through the same-origin
         /api/tmdb proxy, so the handshake would be paid for nothing.
         No crossorigin on wsrv.nl either: preconnecting with it opens a
         CORS-enabled connection, but every poster/backdrop <img> is fetched
         no-CORS, so the socket could never be reused and each image paid an
         extra TCP+TLS handshake. -->
    <link rel="preconnect" href="https://wsrv.nl" />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <!-- Self-hosted Inter (public/fonts/, license OFL.txt): the @font-face rules
         ship in the bundled CSS (src/styles/tokens.css). Preloading the latin
         file here puts its bytes in flight at head-parse time — with no onload=
         handler, which the CSP's script-src blocks as inline JS anyway. The
         other subsets (latin-ext, cyrillic, greek, vietnamese) stay on demand
         via unicode-range. One variable file per subset instead of static
         instances: a single request covers every weight the app renders
         (300–800), so no weight boundary ever re-requests a font. -->
    <link
      rel="preload"
      href="/fonts/inter-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Streamly</title>

    <!-- External boot script: keeps the CSP free of script-src 'unsafe-inline' -->
    <script src="/boot.js"></script>
    <style>
      html, body {
        background: #000;
        color: #fff;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #000;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        pointer-events: none;
      }
      .boot-sk {
        position: relative;
        overflow: hidden;
        background: rgba(127, 127, 127, 0.14);
        border-radius: 10px;
      }
      .boot-sk::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          transparent 20%,
          rgba(255, 255, 255, 0.16) 50%,
          transparent 80%
        );
        transform: translateX(-100%);
        animation: boot-shimmer 1.8s ease-in-out infinite;
      }
      .boot-hero {
        position: relative;
        flex: 0 0 auto;
        min-height: min(80vh, 720px);
        padding: 120px clamp(18px, 4vw, 56px) 44px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 40px;
        box-sizing: border-box;
      }
      .boot-hero-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(70% 90% at 78% 22%, rgba(36, 94, 178, 0.42), transparent 72%),
          radial-gradient(80% 80% at 8% 100%, rgba(72, 42, 124, 0.48), transparent 72%);
        -webkit-mask-image: linear-gradient(to bottom, #000 32%, rgba(0, 0, 0, 0.72) 56%, transparent 96%);
        mask-image: linear-gradient(to bottom, #000 32%, rgba(0, 0, 0, 0.72) 56%, transparent 96%);
      }
      .boot-hx {
        position: relative;
        z-index: 1;
        width: min(580px, 100%);
      }
      .boot-title {
        height: clamp(44px, 6vw, 72px);
        width: min(78%, 460px);
        border-radius: 12px;
        margin-bottom: 14px;
      }
      .boot-meta {
        height: 14px;
        width: min(62%, 340px);
        border-radius: 7px;
        margin-bottom: 16px;
      }
      .boot-line {
        height: 14px;
        width: min(88%, 500px);
        border-radius: 7px;
        margin: 7px 0;
      }
      .boot-line.short {
        width: min(56%, 320px);
        margin-bottom: 24px;
      }
      .boot-btns {
        display: flex;
        gap: 10px;
      }
      .boot-btn {
        height: 48px;
        width: 124px;
        border-radius: 999px;
      }
      .boot-btn.sm {
        width: 104px;
      }
      .boot-dots {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(58, 58, 62, 0.5);
      }
      .boot-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }
      .boot-dot.active {
        width: 28px;
        height: 8px;
        border-radius: 4px;
      }
      .boot-rails {
        padding: 12px clamp(18px, 4vw, 56px) 0;
      }
      .boot-h2 {
        width: 180px;
        height: 24px;
        border-radius: 8px;
        margin-bottom: 14px;
      }
      .boot-rail {
        display: flex;
        gap: 16px;
        overflow: hidden;
      }
      .boot-card {
        flex: 0 0 clamp(138px, 15vw, 180px);
      }
      .boot-poster {
        aspect-ratio: 2 / 3;
        border-radius: 16px;
        width: 100%;
      }
      .boot-ctitle {
        height: 14px;
        width: 78%;
        border-radius: 7px;
        margin-top: 10px;
      }
      .boot-nav {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        width: 292px;
        height: 52px;
        border-radius: 22px;
        background: rgba(58, 58, 62, 0.5);
        box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.3), 0 8px 30px rgba(0, 0, 0, 0.28);
      }
      @keyframes boot-shimmer {
        100% { transform: translateX(100%); }
      }
      @media (max-width: 720px) {
        .boot-hero {
          flex-direction: column;
          align-items: flex-start;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-sk::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" aria-busy="true" aria-label="Loading">
        <div class="boot-hero">
          <div class="boot-hero-bg"></div>
          <div class="boot-hx">
            <div class="boot-sk boot-title"></div>
            <div class="boot-sk boot-meta"></div>
            <div class="boot-sk boot-line"></div>
            <div class="boot-sk boot-line short"></div>
            <div class="boot-btns">
              <div class="boot-sk boot-btn"></div>
              <div class="boot-sk boot-btn sm"></div>
              <div class="boot-sk boot-btn sm"></div>
            </div>
          </div>
          <div class="boot-dots">
            <span class="boot-sk boot-dot active"></span>
            <span class="boot-sk boot-dot"></span>
            <span class="boot-sk boot-dot"></span>
            <span class="boot-sk boot-dot"></span>
            <span class="boot-sk boot-dot"></span>
          </div>
        </div>
        <div class="boot-rails">
          <div class="boot-sk boot-h2"></div>
          <div class="boot-rail">
            <div class="boot-card"><div class="boot-sk boot-poster"></div><div class="boot-sk boot-ctitle"></div></div>
            <div class="boot-card"><div class="boot-sk boot-poster"></div><div class="boot-sk boot-ctitle"></div></div>
            <div class="boot-card"><div class="boot-sk boot-poster"></div><div class="boot-sk boot-ctitle"></div></div>
            <div class="boot-card"><div class="boot-sk boot-poster"></div><div class="boot-sk boot-ctitle"></div></div>
            <div class="boot-card"><div class="boot-sk boot-poster"></div><div class="boot-sk boot-ctitle"></div></div>
            <div class="boot-card"><div class="boot-sk boot-poster"></div><div class="boot-sk boot-ctitle"></div></div>
            <div class="boot-card"><div class="boot-sk boot-poster"></div><div class="boot-sk boot-ctitle"></div></div>
          </div>
        </div>
        <div class="boot-nav"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Streamly - Your favorite movies and TV shows in one place." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect: CDN image proxy first, then fallback origins.
         No preconnect to api.themoviedb.org: that host is ISP-blocked on some
         networks (see api/tmdb.js) and the app reads TMDB through the same-origin
         /api/tmdb proxy, so the handshake would be paid for nothing. -->
    <link rel="preconnect" href="https://wsrv.nl" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-blocking font load: preloaded + applied by public/boot.js once ready
         (an onload= attribute would be an inline event handler, which the CSP's
         script-src without 'unsafe-inline' blocks) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Streamly</title>

    <!-- External boot script: keeps the CSP free of script-src 'unsafe-inline' -->
    <script src="/boot.js"></script>
    <!-- Fonts: apply the preloaded Google stylesheet before first paint (CSP-safe,
         no inline handler) -->
    <script src="/fonts.js"></script>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #050505;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .spinner-ring {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(255,255,255,0.1);
        border-top-color: #E50914;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 24px;
      }
      @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner-ring"></div>
        <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em;">Streamly</div>
        <div style="font-size: 14px; color: rgba(255,255,255,0.5); margin-top: 8px;">Loading app...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
